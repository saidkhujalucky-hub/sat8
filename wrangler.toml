name = "sat-preparation-platform"
main = "worker/index.mjs"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
[assets]
directory = "./public"
binding = "ASSETS"
[[d1_databases]]
binding = "DB"
database_name = "sat-platform-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
[vars]
PAYMENT_MODE = "manual"
PREMIUM_PRICE_UZS = "19000"
NODE_ENV = "production"
